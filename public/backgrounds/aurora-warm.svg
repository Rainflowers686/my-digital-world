<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="o">
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="o" mode="multiply"/>
    </filter>
    <filter id="blur-large">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blur-medium">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="#f7f3ea"/>
  <!-- warm orange glow - top right -->
  <circle cx="900" cy="200" r="300" fill="rgba(217,119,87,0.10)" filter="url(#blur-large)"/>
  <!-- subtle teal/cyan glow - bottom left -->
  <circle cx="200" cy="900" r="250" fill="rgba(47,111,115,0.07)" filter="url(#blur-medium)"/>
  <rect width="1200" height="1200" fill="none" filter="url(#noise)"/>
</svg>
