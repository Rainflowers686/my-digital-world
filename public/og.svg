<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="o">
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="o" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f7f3ea"/>
  <rect width="1200" height="630" fill="none" filter="url(#noise)"/>
  <text x="600" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="400" fill="#1f1b16" letter-spacing="-1">Rain's Digital World</text>
  <text x="600" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#6f675c" letter-spacing="-0.5">Build, Learn, Create.</text>
  <text x="600" y="400" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="20" fill="#c96442" letter-spacing="2">Personal Digital Garden</text>
</svg>
